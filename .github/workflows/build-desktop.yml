name: Build macOS and Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            runner: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            artifactName: Remote-OCP-macOS
            artifactPath: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            artifactName: Remote-OCP-Windows
            artifactPath: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoVersion = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)
            || process.env.RELEASE_TAG !== `v${packageVersion}`
            || tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error('Release tag must match the stable version in package.json, tauri.conf.json, and Cargo.toml.');
          }
          NODE

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test UI behavior and translations
        run: npm test

      - name: Build desktop application
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Test connection logic
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish installers
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download tested application bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Remote-OCP-*
          path: artifacts

      - name: Prepare installers and checksums
        run: |
          python3 <<'PY'
          import hashlib
          import pathlib
          import shutil

          source = pathlib.Path('artifacts')
          destination = pathlib.Path('release-assets')
          destination.mkdir()
          installers = {
              'Remote-OCP-macOS/**/*.dmg': 'Remote-OCP-macOS-universal.dmg',
              'Remote-OCP-Windows/**/*.exe': 'Remote-OCP-Windows-x64-setup.exe',
              'Remote-OCP-Windows/**/*.msi': 'Remote-OCP-Windows-x64.msi',
          }
          checksums = []
          for pattern, name in installers.items():
              matches = list(source.glob(pattern))
              if len(matches) != 1 or not matches[0].is_file() or matches[0].stat().st_size == 0:
                  raise SystemExit(f'Expected exactly one nonempty installer for {pattern}: {matches}')
              target = destination / name
              shutil.copyfile(matches[0], target)
              checksums.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {name}\n')
          (destination / 'SHA256SUMS.txt').write_text(''.join(checksums), encoding='utf-8')
          PY

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          if release_state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$release_state" != "true" ]; then
              # One-time, owner-requested consolidation into 2.2.1. Exact asset
              # IDs prevent this exception from replacing a subsequent build.
              if [ "$RELEASE_TAG" = "v2.2.1" ] && gh api "repos/$GH_REPO/releases/428836981" \
                --jq '.tag_name == "v2.2.1" and ([.assets[].id] | sort) == [691575332,691575333,691575338,691575341]' | grep -qx true; then
                gh release edit "$RELEASE_TAG" --draft=true
              else
                echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
                exit 0
              fi
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Remote OCP ${RELEASE_TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$notes" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Withdraw the superseded interim release
        if: github.ref_name == 'v2.2.1' && steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep the old installers recoverable as a draft until the new 2.2.1
          # installers have been published successfully.
          gh api "repos/$GH_REPO/releases/428852204" \
            --jq '.tag_name == "v2.2.2" and ([.assets[].id] | sort) == [691615510,691615511,691615512,691615513]' | grep -qx true
          gh release edit v2.2.2 --draft=true
